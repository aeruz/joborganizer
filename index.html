<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AnimTrack - Unified Manager</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.8/babel.min.js"></script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #4B5563; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        body { 
            background-color: #030712; 
            color: #f3f4f6; 
            overflow: hidden; 
            overscroll-behavior: none; 
            font-family: system-ui, -apple-system, sans-serif; 
        }

        /* Ambient & Lively TV Animations */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .fade-switch { animation: fadeSwitch 0.5s ease-in-out; }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-spin-slow { animation: spinSlow 40s linear infinite; }
        .animate-slide-up-fade { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Pure CSS Progress Bar */
        .animate-fill-bar { animation: fillBar 5s linear infinite; }
        
        .animate-sweep {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            background-size: 200% 100%;
            animation: sweep 2.5s infinite linear;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes fadeSwitch { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes spinSlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes sweep { 0% { background-position: 200% center; } 100% { background-position: -200% center; } }
        @keyframes fillBar { 0% { width: 0%; } 100% { width: 100%; } }
        
        .editor-content ul { list-style-type: disc; margin-left: 1.25rem; }
        .editor-content ol { list-style-type: decimal; margin-left: 1.25rem; }
        .editor-content b { font-weight: bold; }
        .editor-content i { font-style: italic; }
        
        input[type="range"] { 
            -webkit-appearance: none; 
            background: #1f2937; 
            cursor: pointer; 
            width: 100%; 
            height: 6px; 
            border-radius: 99px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-runnable-track { 
            background: transparent; 
            height: 6px; 
            border-radius: 99px; 
        }
        input[type="range"]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            height: 16px; 
            width: 16px; 
            background: #3b82f6; 
            border-radius: 50%; 
            margin-top: -5px; 
            border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
            position: relative;
            z-index: 2;
        }
        input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.2); }
        
        @media (max-width: 1024px) {
            .tablet-scroll { overflow-y: auto !important; height: auto !important; max-height: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        // Confirmed Safe Icons
        import { 
            Plus, DollarSign, Clock, CheckCircle, Box, Calendar, Edit2, 
            Trash2, X, Save, TrendingUp, CreditCard, Briefcase, 
            ChevronLeft, ChevronRight, Filter, Settings, 
            Layers, ArrowRight, Download, Upload, FileJson, LayoutGrid, CalendarDays,
            BarChart2, Target, Star, Folder, RotateCcw, Bold, Italic, Underline, 
            List, ListOrdered, Eye, EyeOff, Type, Highlighter, Eraser, Minus, Umbrella, Flag,
            Zap, AlertCircle, PieChart, Activity, Monitor, Cloud, Bell
        } from 'lucide-react';

        // --- GITHUB CLOUD SYNC SETTINGS ---
        const GIST_FILENAME = 'animtrack_data.json';
        const LOCAL_GIST_KEY = 'animtrack_gist_id';
        const GITHUB_TOKEN_KEY = 'animtrack_gh_token'; 
        const STORAGE_KEY = 'animtrack_db_v27'; 

        // --- SAFE STORAGE WRAPPERS ---
        const safeGetStorage = (key) => { try { return localStorage.getItem(key); } catch(e) { return null; } };
        const safeSetStorage = (key, val) => { try { localStorage.setItem(key, val); } catch(e) {} };
        const safeRemoveStorage = (key) => { try { localStorage.removeItem(key); } catch(e) {} };
        
        const FONTS = [
            { label: 'Default UI', value: 'system-ui, -apple-system, sans-serif' },
            { label: 'Google Sans', value: '"Product Sans", "Segoe UI", Roboto, Arial, sans-serif' },
            { label: 'Arial', value: 'Arial, sans-serif' },
            { label: 'Verdana', value: 'Verdana, sans-serif' },
            { label: 'Monospace', value: 'monospace' }
        ];

        const STATUS_FLOW = ['inquiry', 'layout', 'blocking', 'splining', 'polishing', 'revision', 'completed', 'paid'];

        const getStatusStyles = (status) => {
            switch(status) {
                case 'layout': return 'bg-cyan-900/30 text-cyan-400 border-cyan-800';
                case 'blocking': return 'bg-blue-900/30 text-blue-400 border-blue-800';
                case 'splining': return 'bg-indigo-900/30 text-indigo-400 border-indigo-800';
                case 'polishing': return 'bg-purple-900/30 text-purple-400 border-purple-800';
                case 'revision': return 'bg-yellow-900/40 text-yellow-400 border-yellow-700';
                case 'completed': return 'bg-yellow-900/30 text-yellow-500 border-yellow-800';
                case 'paid': return 'bg-emerald-900/30 text-emerald-500 border-emerald-800';
                default: return 'bg-gray-800 text-gray-400 border-gray-700';
            }
        };

        const parseLocalDate = (dStr) => {
            if (!dStr) return null;
            if (dStr instanceof Date) return dStr;
            const str = String(dStr);
            if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
                const [y, m, d] = str.split('-').map(Number);
                return new Date(y, m - 1, d);
            }
            const parsed = new Date(str);
            return isNaN(parsed.getTime()) ? null : parsed;
        };

        const formatDate = (date) => {
            const d = new Date(date);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const calculateTicketValue = (p, clients = []) => {
            const client = (clients || []).find(c => c.name === p.client);
            if (client?.mode === 'fixed') return parseFloat(client.defaultRate || 0);
            return (parseFloat(p.shotRate || 0) * (parseFloat(p.shotCount) || 1));
        };

        // --- DATA SYNC LOGIC ---

        const loadLocalData = () => {
            try {
                const saved = safeGetStorage(STORAGE_KEY);
                if (saved) {
                    const p = JSON.parse(saved);
                    return {
                        projects: Array.isArray(p.projects) ? p.projects : [],
                        clients: Array.isArray(p.clients) ? p.clients : [],
                        holidays: Array.isArray(p.holidays) ? p.holidays : [],
                        leaves: Array.isArray(p.leaves) ? p.leaves : [],
                        reminders: Array.isArray(p.reminders) ? p.reminders : [],
                        totalLeaves: p.totalLeaves ?? 22,
                        lastUpdated: p.lastUpdated || Date.now()
                    };
                }
            } catch (e) { console.error("Local load error", e); }
            return { projects: [], clients: [], holidays: [], leaves: [], reminders: [], totalLeaves: 22, lastUpdated: Date.now() };
        };

        const saveLocalData = (data) => {
            try { safeSetStorage(STORAGE_KEY, JSON.stringify(data)); } 
            catch (e) { console.error("Local save error", e); }
        };

        const fetchCloudData = async () => {
            const token = safeGetStorage(GITHUB_TOKEN_KEY);
            const gistId = safeGetStorage(LOCAL_GIST_KEY);
            if (token && gistId) {
                try {
                    const res = await fetch(`https://api.github.com/gists/${gistId}?t=${Date.now()}`, {
                        headers: { Authorization: `token ${token}`, 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' },
                        cache: 'no-store'
                    });
                    if (res.ok) {
                        const gist = await res.json();
                        const content = gist.files[GIST_FILENAME]?.content;
                        if (content) {
                            const p = JSON.parse(content);
                            return {
                                projects: Array.isArray(p.projects) ? p.projects : [],
                                clients: Array.isArray(p.clients) ? p.clients : [],
                                holidays: Array.isArray(p.holidays) ? p.holidays : [],
                                leaves: Array.isArray(p.leaves) ? p.leaves : [],
                                reminders: Array.isArray(p.reminders) ? p.reminders : [],
                                totalLeaves: p.totalLeaves ?? 22,
                                lastUpdated: p.lastUpdated || Date.now()
                            };
                        }
                    }
                } catch (e) { console.error("Cloud fetch failed, using local.", e); }
            }
            return null; 
        };

        // --- UI Components ---

        const StatCard = ({ title, value, icon: Icon, colorClass, subtext, onClick }) => (
            <div onClick={onClick} className={`bg-gray-900 border border-gray-800 p-4 rounded-3xl flex items-center space-x-4 shadow-lg hover:border-gray-700 transition cursor-pointer group relative overflow-hidden`}>
                <div className={`p-2 rounded-xl ${colorClass} bg-opacity-20`}><Icon className={colorClass.replace('bg-', 'text-')} size={20}/></div>
                <div className="z-10">
                    <p className="text-gray-500 text-[9px] font-black uppercase tracking-widest">{title}</p>
                    <h3 className="text-xl font-bold text-white">{value}</h3>
                    {subtext && <p className="text-[10px] text-gray-500 mt-0.5">{subtext}</p>}
                </div>
                <Icon className={`absolute -right-4 -bottom-4 w-20 h-20 opacity-5 ${colorClass.replace('bg-', 'text-')} transform -rotate-12 group-hover:scale-110 transition`} />
            </div>
        );

        const RichTextEditor = ({ value, onChange }) => {
            const editorRef = useRef(null);
            const [isExpanded, setIsExpanded] = useState(false);
            
            useEffect(() => {
                if (editorRef.current && value !== editorRef.current.innerHTML) {
                    if (document.activeElement !== editorRef.current) editorRef.current.innerHTML = value || '';
                }
            }, [value]);

            const exec = (cmd, val = null) => {
                document.execCommand(cmd, false, val);
                onChange(editorRef.current.innerHTML);
            };

            const handlePaste = (e) => {
                e.preventDefault();
                const text = e.clipboardData.getData('text/plain');
                document.execCommand('insertText', false, text);
            };

            const resetToDefault = () => {
                const sel = window.getSelection();
                if (!sel.rangeCount) return;
                const range = sel.getRangeAt(0);
                
                if (range.collapsed) {
                    const fullRange = document.createRange();
                    fullRange.selectNodeContents(editorRef.current);
                    sel.removeAllRanges();
                    sel.addRange(fullRange);
                }

                document.execCommand('foreColor', false, '#d1d5db');
                document.execCommand('fontName', false, FONTS[0].value);
                document.execCommand('fontSize', false, '3');
                document.execCommand('hiliteColor', false, 'transparent');
                document.execCommand('backColor', false, 'transparent'); 
                
                if (document.queryCommandState('bold')) document.execCommand('bold', false, null);
                if (document.queryCommandState('italic')) document.execCommand('italic', false, null);
                if (document.queryCommandState('underline')) document.execCommand('underline', false, null);

                sel.removeAllRanges();
                onChange(editorRef.current.innerHTML);
            };

            return (
                <>
                    {/* Backdrop overlay for Focus Mode */}
                    {isExpanded && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[90] fade-in" onClick={() => setIsExpanded(false)} />
                    )}
                    
                    <div className={`${isExpanded ? 'fixed inset-4 md:inset-12 z-[100] shadow-[0_0_50px_rgba(0,0,0,0.5)] rounded-3xl fade-in' : 'h-[400px] rounded-xl'} bg-gray-950 border border-gray-800 overflow-hidden flex flex-col transition-all`}>
                        <div className="flex flex-wrap items-center gap-1 p-2 bg-gray-900 border-b border-gray-800 shrink-0">
                            <div className="flex gap-0.5 bg-gray-950 p-1 rounded-lg border border-gray-800 mr-1">
                                <button onClick={()=>exec('bold')} className="p-1.5 hover:bg-gray-800 rounded text-gray-400"><Bold size={14}/></button>
                                <button onClick={()=>exec('italic')} className="p-1.5 hover:bg-gray-800 rounded text-gray-400"><Italic size={14}/></button>
                                <button onClick={()=>exec('underline')} className="p-1.5 hover:bg-gray-800 rounded text-gray-400"><Underline size={14}/></button>
                            </div>
                            <div className="flex gap-1 items-center bg-gray-950 p-1 rounded-lg border border-gray-800 mr-1 text-gray-400">
                                <input type="color" onChange={(e)=>exec('foreColor', e.target.value)} className="w-4 h-4 bg-transparent border-0 cursor-pointer" title="Font Color"/>
                                <input type="color" onChange={(e)=>exec('hiliteColor', e.target.value)} className="w-4 h-4 bg-transparent border-0 cursor-pointer" title="Highlight Color"/>
                            </div>
                            <select onChange={(e)=>exec('fontName', e.target.value)} className="bg-gray-950 text-[10px] p-1.5 rounded border border-gray-800 text-gray-300 outline-none w-24">
                                <option value="">Font...</option>
                                {FONTS.map(f=><option key={f.label} value={f.value}>{f.label}</option>)}
                            </select>
                            <select onChange={(e)=>exec('fontSize', e.target.value)} className="bg-gray-950 text-[10px] p-1.5 rounded border border-gray-800 text-gray-300 outline-none">
                                <option value="">Size...</option>
                                {[1,2,3,4,5,6,7].map(s=><option key={s} value={s}>{s}</option>)}
                            </select>
                            
                            {/* Grouped Right Tools */}
                            <div className="flex items-center ml-auto gap-2">
                                <button onClick={resetToDefault} className="p-1.5 hover:bg-red-900/20 text-gray-500 hover:text-red-400 rounded-lg"><Eraser size={14}/></button>
                                <button 
                                    onClick={() => setIsExpanded(!isExpanded)} 
                                    className={`py-1.5 px-4 rounded-lg font-bold text-[10px] uppercase tracking-widest transition ${isExpanded ? 'bg-blue-600 text-white shadow-lg hover:bg-blue-500' : 'bg-gray-800 text-gray-400 hover:text-white hover:bg-gray-700 border border-gray-700'}`}
                                >
                                    {isExpanded ? 'Collapse' : 'Expand'}
                                </button>
                            </div>
                        </div>
                        <div 
                            ref={editorRef} 
                            className={`editor-content p-4 outline-none text-sm text-gray-300 overflow-y-auto custom-scrollbar flex-1 ${isExpanded ? 'text-xl leading-relaxed' : ''}`} 
                            contentEditable 
                            onPaste={handlePaste}
                            onInput={(e)=>onChange(e.target.innerHTML)} 
                        />
                    </div>
                </>
            );
        };

        // --- SAFE SVG ANALOG CLOCK ---
        const AnalogClock = ({ time }) => {
            const seconds = time.getSeconds();
            const minutes = time.getMinutes();
            const hours = time.getHours() % 12 + minutes / 60;

            const dots = [];
            for (let i = 0; i < 60; i++) {
                const angle = (i / 60) * Math.PI * 2;
                const x = 100 + 90 * Math.cos(angle);
                const y = 100 + 90 * Math.sin(angle);
                const isActive = i <= seconds;
                const isCurrent = i === seconds;
                
                dots.push(
                    <circle 
                        key={i} 
                        cx={x} 
                        cy={y} 
                        r={i % 5 === 0 ? "3.5" : "1.5"} 
                        fill={isActive ? '#3b82f6' : '#1f2937'} 
                        className={`transition-colors duration-300 ${isCurrent ? 'fill-white' : ''}`}
                    />
                );
            }

            return (
                <svg width="220" height="220" viewBox="0 0 200 200" className="transform -rotate-90 drop-shadow-2xl">
                    <circle cx="100" cy="100" r="90" fill="none" stroke="#1f2937" strokeWidth="2" opacity="0.5" />
                    {dots}
                    <line x1="100" y1="100" x2={100 + 40 * Math.cos((hours / 12) * Math.PI * 2)} y2={100 + 40 * Math.sin((hours / 12) * Math.PI * 2)} stroke="#9ca3af" strokeWidth="8" strokeLinecap="round" />
                    <line x1="100" y1="100" x2={100 + 65 * Math.cos((minutes / 60) * Math.PI * 2)} y2={100 + 65 * Math.sin((minutes / 60) * Math.PI * 2)} stroke="white" strokeWidth="5" strokeLinecap="round" className="drop-shadow-lg" />
                    <circle cx="100" cy="100" r="8" fill="#3b82f6" className="drop-shadow-[0_0_8px_rgba(59,130,246,0.8)]"/>
                </svg>
            );
        };

        // --- 4K TV DASHBOARD (SCREENSAVER) ---
        const ScreensaverView = ({ projects, reminders, onExit, onAutoSync }) => {
            const [time, setTime] = useState(new Date());
            const [weather, setWeather] = useState({ temp: '--', condition: 'Updating...' });
            const [activeAlarm, setActiveAlarm] = useState(null);
            
            const [rIndex, setRIndex] = useState(0);
            const [pIndex, setPIndex] = useState(0);
            
            const triggeredAlarms = useRef({});

            // Pre-calculate Active Projects for the Carousel
            const inProgressProjects = useMemo(() => {
                const active = (projects || []).filter(p => p.status !== 'paid' && p.status !== 'completed');
                const inProgress = active.filter(p => p.progress > 0 && p.progress < 100);
                if (inProgress.length > 0) {
                    return [...inProgress].sort((a,b) => (b.progress || 0) - (a.progress || 0));
                }
                if (active.length > 0) {
                    return [active[active.length - 1]];
                }
                return [];
            }, [projects]);

            // Retrieve the active project safely based on pIndex
            const activeProject = inProgressProjects.length > 0 ? inProgressProjects[pIndex % inProgressProjects.length] : null;

            // 1. Core Clock, Sync & Project Swipe Engine
            useEffect(() => {
                const clockTimer = setInterval(() => setTime(new Date()), 1000);
                const syncTimer = setInterval(() => onAutoSync(true), 60000); // Silent auto-sync every 60s
                
                // Vertical Project Swipe Engine (Every 8 Seconds)
                const projTimer = setInterval(() => {
                    setPIndex(prev => prev + 1);
                }, 8000);
                
                return () => {
                    clearInterval(clockTimer);
                    clearInterval(syncTimer);
                    clearInterval(projTimer);
                };
            }, [onAutoSync]);

            // 2. Alarm Trigger Engine (Checks every 10 seconds)
            useEffect(() => {
                const alarmCheck = setInterval(() => {
                    const now = new Date();
                    const currentMins = now.getHours() * 60 + now.getMinutes();
                    const todayStr = now.toDateString();

                    (reminders || []).forEach(r => {
                        if (!r.time) return;
                        const parts = r.time.split(':');
                        if (parts.length < 2) return;
                        const hr = parseInt(parts[0], 10);
                        const min = parseInt(parts[1], 10);
                        const eventMins = hr * 60 + min;
                        const alertMins = eventMins - (r.offset || 0);

                        if (currentMins >= alertMins && currentMins < eventMins) {
                            const triggerKey = `${r.id}-${todayStr}`;
                            if (!triggeredAlarms.current[triggerKey]) {
                                triggeredAlarms.current[triggerKey] = true;
                                const d = new Date(); d.setHours(hr, min, 0);
                                const eventTimeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                
                                setActiveAlarm({ ...r, eventTimeStr });
                                setTimeout(() => setActiveAlarm(null), 60000); // Auto dismiss after 1 min
                            }
                        }
                    });
                }, 10000);
                return () => clearInterval(alarmCheck);
            }, [reminders]);

            // 3. Carousel Engine for Reminders (5 second sweeps using CSS)
            useEffect(() => {
                if (!reminders || reminders.length <= 2) return;
                const carouselTimer = setInterval(() => {
                    setRIndex(prev => prev + 2);
                }, 5000);
                return () => clearInterval(carouselTimer);
            }, [reminders]);

            const getVisibleReminders = () => {
                if (!reminders || reminders.length === 0) return [];
                if (reminders.length <= 2) return reminders;
                const first = reminders[rIndex % reminders.length];
                const second = reminders[(rIndex + 1) % reminders.length];
                return [first, second].filter(Boolean);
            };

            // 4. Weather Fetcher
            useEffect(() => {
                const fetchWeather = async () => {
                    try {
                        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=10.3157&longitude=123.8854&current_weather=true');
                        if (res.ok) {
                            const data = await res.json();
                            const code = data.current_weather ? data.current_weather.weathercode : 0;
                            const temp = data.current_weather ? Math.round(data.current_weather.temperature) : '--';
                            let desc = 'Clear';
                            if(code > 0 && code <= 3) desc = 'Cloudy';
                            else if(code >= 45 && code <= 48) desc = 'Foggy';
                            else if(code >= 51 && code <= 67) desc = 'Rainy';
                            else if(code >= 71 && code <= 77) desc = 'Snowy';
                            else if(code >= 95) desc = 'Storm';
                            setWeather({ temp: `${temp}°C`, condition: desc });
                        }
                    } catch(e) {}
                };
                fetchWeather();
                const weatherTimer = setInterval(fetchWeather, 30 * 60 * 1000);
                return () => clearInterval(weatherTimer);
            }, []);

            // Secure Deadline Math
            let deadlineProg = 0;
            let isOverdue = false;
            let deadlineStr = 'No deadline set';
            let activeProjectDateStr = null;

            if (activeProject && activeProject.deadline) {
                const dlDate = parseLocalDate(activeProject.deadline);
                if (dlDate) {
                    activeProjectDateStr = dlDate.toDateString();
                }
            }

            if (activeProject && activeProject.startDate && activeProject.deadline) {
                const start = parseLocalDate(activeProject.startDate);
                const dl = parseLocalDate(activeProject.deadline);
                if (start && dl) {
                    deadlineStr = formatDate(dl);
                    const total = dl.getTime() - start.getTime();
                    if (total > 0) {
                        deadlineProg = Math.max(0, Math.min(100, ((time.getTime() - start.getTime()) / total) * 100));
                    } else {
                        deadlineProg = 100;
                    }
                    dl.setHours(23, 59, 59);
                    if (time > dl) isOverdue = true;
                }
            }

            // Build TV Calendar Data Securely (No .flat())
            const tvCalendar = useMemo(() => {
                const startM = new Date(time.getFullYear(), time.getMonth(), 1);
                const startD = new Date(startM); startD.setDate(startD.getDate() - startD.getDay());
                const endM = new Date(time.getFullYear(), time.getMonth() + 1, 0);
                const endD = new Date(endM); if (endD.getDay() !== 6) endD.setDate(endD.getDate() + (6 - endD.getDay()));
                
                const w = []; let iter = new Date(startD);
                while (iter <= endD || w.length < 5) {
                    let week = [];
                    for(let i=0; i<7; i++){ week.push(new Date(iter)); iter.setDate(iter.getDate()+1); }
                    w.push(week);
                }
                return w;
            }, [time.getMonth()]);
            
            // Format time safely for all browsers
            const timeRawStr = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const timeVal = timeRawStr.replace(/[a-zA-Z.]/g, '').trim();
            const ampmMatch = timeRawStr.match(/[a-zA-Z]+/);
            const ampmStr = ampmMatch ? ampmMatch[0].toUpperCase() : '';

            return (
                <div className="fixed inset-0 bg-[#030712] z-[100] p-6 lg:p-10 flex flex-col cursor-default fade-in overflow-hidden h-screen w-screen relative">
                    
                    {/* Global Ambient Background */}
                    <div className="absolute top-0 right-0 w-[50%] h-[50%] bg-blue-900/10 rounded-full blur-[150px] mix-blend-screen animate-spin-slow pointer-events-none"></div>
                    <div className="absolute bottom-0 left-0 w-[50%] h-[50%] bg-purple-900/10 rounded-full blur-[150px] mix-blend-screen animate-spin-slow pointer-events-none" style={{animationDirection: 'reverse'}}></div>
                    
                    {/* ALARM OVERLAY */}
                    {activeAlarm && (
                        <div className="fixed inset-0 z-[200] bg-red-950/95 flex flex-col items-center justify-center fade-in backdrop-blur-md">
                            <div className="absolute inset-0 bg-red-500/20 pulse-slow mix-blend-overlay"></div>
                            <Bell size={120} className="text-red-500 mb-8 animate-bounce" />
                            <h1 className="text-6xl md:text-8xl font-black text-white mb-6 uppercase tracking-widest text-center">Reminder</h1>
                            <p className="text-4xl md:text-6xl font-bold text-red-200 text-center max-w-4xl leading-tight">{activeAlarm.title}</p>
                            <p className="text-2xl md:text-4xl text-red-400 mt-6 font-mono font-bold tracking-tight">Scheduled Event: {activeAlarm.eventTimeStr}</p>
                            <button onClick={()=>setActiveAlarm(null)} className="mt-16 px-12 py-6 bg-red-600 rounded-3xl text-white text-2xl md:text-3xl font-black tracking-widest hover:scale-105 transition shadow-2xl relative z-10">DISMISS</button>
                        </div>
                    )}

                    {/* Exit Button */}
                    <button onClick={onExit} className="absolute top-6 right-6 p-4 text-gray-600 hover:text-white transition group flex items-center gap-2 z-50">
                        <span className="text-xs font-bold uppercase tracking-widest opacity-0 group-hover:opacity-100 transition">Exit Dashboard</span>
                        <X size={24} />
                    </button>
                    
                    <div className="flex flex-col gap-6 lg:gap-10 h-full min-h-0 relative z-10">
                        
                        {/* =========================================
                            TOP ROW: 60% HEIGHT (MASSIVE CLOCKS/CAL) 
                           ========================================= */}
                        <div className="flex-[3] grid grid-cols-1 lg:grid-cols-5 gap-6 lg:gap-10 min-h-0">
                            
                            {/* Clocks & Weather Container */}
                            <div className="col-span-3 bg-gray-900/40 rounded-[3rem] p-10 border border-gray-800 shadow-2xl backdrop-blur-xl flex flex-col justify-between relative overflow-hidden">
                                <div className="absolute inset-0 bg-gradient-to-br from-blue-500/5 to-transparent mix-blend-overlay"></div>
                                
                                <div className="flex justify-between items-center h-full">
                                    <div className="flex items-center gap-8 lg:gap-12 pl-4">
                                        <div className="shrink-0 drop-shadow-xl">
                                            <AnalogClock time={time} />
                                        </div>
                                        <div>
                                            <h1 className="text-7xl lg:text-[7.5rem] font-black text-white leading-none tracking-tighter drop-shadow-lg flex items-end">
                                                {timeVal}
                                                <span className="text-4xl lg:text-5xl text-gray-500 ml-4 tracking-normal uppercase pb-2">{ampmStr}</span>
                                            </h1>
                                            <p className="text-2xl lg:text-3xl text-blue-500 font-bold tracking-tight mt-4 drop-shadow-sm">{time.toLocaleDateString('default', { weekday: 'long', month: 'long', day: 'numeric' })}</p>
                                        </div>
                                    </div>
                                    <div className="text-right flex flex-col items-end pr-8 animate-float">
                                        <Cloud size={80} className="text-gray-500 mb-2"/>
                                        <div className="text-5xl lg:text-6xl font-black text-yellow-500 drop-shadow-md">{weather.temp}</div>
                                        <p className="text-xl lg:text-2xl text-gray-500 font-bold uppercase tracking-widest mt-2">{weather.condition}</p>
                                    </div>
                                </div>
                            </div>

                            {/* TV Calendar Container */}
                            <div className="col-span-2 bg-gray-900/40 rounded-[3rem] p-8 border border-gray-800 shadow-2xl backdrop-blur-xl flex flex-col">
                                <h3 className="text-2xl font-black text-gray-500 uppercase tracking-widest mb-6 text-center">{time.toLocaleString('default', { month: 'long', year: 'numeric' })}</h3>
                                <div className="grid grid-cols-7 gap-2 mb-2 shrink-0">
                                    {['S','M','T','W','T','F','S'].map((d,i)=><div key={i} className="text-center text-sm font-black text-gray-600 uppercase">{d}</div>)}
                                </div>
                                <div className="flex-1 flex flex-col gap-2">
                                    {tvCalendar.map((week, wIdx) => (
                                        <div key={wIdx} className="flex-1 grid grid-cols-7 gap-2 h-full">
                                            {week.map((day, dIdx) => {
                                                const isToday = day.toDateString() === time.toDateString();
                                                const isOtherMonth = day.getMonth() !== time.getMonth();
                                                
                                                // Check for general dots
                                                const hasDeadline = (projects || []).some(p => {
                                                    if(p.status === 'paid' || p.status === 'completed' || !p.deadline) return false;
                                                    const d = parseLocalDate(p.deadline);
                                                    return d && d.toDateString() === day.toDateString();
                                                });
                                                
                                                // Check for Calendar Glow-Jump logic
                                                const isCurrentDeadline = activeProjectDateStr === day.toDateString();

                                                let cellClass = `h-full w-full flex flex-col items-center justify-center rounded-xl relative transition-all duration-700 ease-in-out `;
                                                if (isCurrentDeadline) {
                                                    if (isOverdue) {
                                                        cellClass += `bg-red-900/40 border-2 border-red-500 scale-110 z-20 text-white animate-pulse `;
                                                    } else {
                                                        cellClass += `bg-blue-900/40 border-2 border-blue-500 scale-110 z-20 text-white `;
                                                    }
                                                } else if (isToday) {
                                                    cellClass += `bg-blue-600 text-white scale-105 z-10 shadow-lg `;
                                                } else if (isOtherMonth) {
                                                    cellClass += `opacity-20 text-gray-400 bg-gray-950/30 `;
                                                } else {
                                                    cellClass += `text-gray-400 bg-gray-950/30 `;
                                                }

                                                return (
                                                    <div key={dIdx} className={cellClass}>
                                                        <span className={`text-xl lg:text-2xl font-bold ${isToday || isCurrentDeadline ? 'text-white' : 'text-gray-300'}`}>{day.getDate()}</span>
                                                        {hasDeadline && !isCurrentDeadline && <div className={`w-2 h-2 rounded-full absolute bottom-2 ${isToday ? 'bg-white' : 'bg-red-500'}`}></div>}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* =========================================
                            BOTTOM ROW: 40% HEIGHT (LEVELED SHOT/REM)
                           ========================================= */}
                        <div className="flex-[2] grid grid-cols-1 lg:grid-cols-5 gap-6 lg:gap-10 min-h-0">
                            
                            {/* Shot Progress Dashboard */}
                            <div className="col-span-3 bg-gray-900/40 rounded-[2rem] p-8 border border-gray-800 shadow-2xl backdrop-blur-xl flex flex-col justify-center relative overflow-hidden">
                                
                                {/* Carousel Navigation Dots */}
                                {inProgressProjects.length > 1 && (
                                    <div className="absolute top-6 right-8 flex gap-2 z-20">
                                        {inProgressProjects.map((_, i) => {
                                            const isActive = i === (pIndex % inProgressProjects.length);
                                            return (
                                                <div key={i} className={`w-2 h-2 rounded-full transition-all duration-500 ${isActive ? 'bg-blue-500 scale-150' : 'bg-gray-700'}`} />
                                            );
                                        })}
                                    </div>
                                )}

                                {activeProject ? (
                                    <div key={activeProject.id ? activeProject.id : pIndex} className="space-y-6 lg:space-y-8 relative z-10 animate-slide-up-fade w-full">
                                        <div className="flex justify-between items-start">
                                            <div className="pr-4">
                                                <div className="flex items-center gap-3 mb-2">
                                                    <Briefcase size={20} className="text-blue-500" />
                                                    <p className="text-blue-400 font-black uppercase tracking-widest text-base">{activeProject.client}</p>
                                                </div>
                                                <h2 className="text-3xl lg:text-4xl font-black text-white leading-tight truncate max-w-2xl">{activeProject.name}</h2>
                                            </div>
                                            <div className="text-right shrink-0">
                                                <div className={`px-4 py-2 rounded-xl border text-sm font-black uppercase inline-block shadow-lg ${getStatusStyles(activeProject.status)}`}>{activeProject.status}</div>
                                            </div>
                                        </div>
                                        
                                        <div className="space-y-6 pt-2">
                                            {/* Production Progress Bar */}
                                            <div className="space-y-2">
                                                <div className="flex justify-between text-sm lg:text-base font-bold text-gray-400 uppercase tracking-widest">
                                                    <span>Production Render</span>
                                                    <span className="text-white font-black">{activeProject.progress || 0}%</span>
                                                </div>
                                                <div className="w-full bg-gray-950 h-6 lg:h-8 rounded-full overflow-hidden border border-gray-800 shadow-inner relative">
                                                    <div 
                                                        className="h-full bg-blue-600 transition-all duration-1000 ease-out absolute left-0 top-0 bottom-0 overflow-hidden" 
                                                        style={{ width: `${activeProject.progress || 0}%` }}
                                                    >
                                                        {/* Scanning Light Beam Effect */}
                                                        <div className="absolute inset-0 animate-sweep mix-blend-overlay"></div>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Deadline Duration Bar */}
                                            <div className="space-y-2">
                                                <div className="flex justify-between text-xs lg:text-sm font-bold text-gray-500 uppercase tracking-widest">
                                                    <span>Delivery Window</span>
                                                    <span className={isOverdue ? 'text-red-500 font-black' : 'text-gray-400'}>{isOverdue ? 'OVERDUE' : `Deadline: ${deadlineStr}`}</span>
                                                </div>
                                                <div className="w-full bg-gray-950 h-3 rounded-full overflow-hidden shadow-inner">
                                                    <div 
                                                        className={`h-full ${isOverdue ? 'bg-red-500' : 'bg-yellow-600'} transition-all duration-1000 ease-out`} 
                                                        style={{ width: `${deadlineProg}%` }}
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-center py-4 relative z-10">
                                        <div className="w-16 h-16 bg-gray-800/50 rounded-full flex items-center justify-center mx-auto mb-4"><Target size={28} className="text-gray-600"/></div>
                                        <h2 className="text-2xl font-black text-gray-500 tracking-tight">No Active Shots</h2>
                                        <p className="text-gray-600 mt-2 text-sm font-medium">Dashboard is waiting for a new ticket to track.</p>
                                    </div>
                                )}
                            </div>

                            {/* Scrolling Reminders Tab */}
                            <div className="col-span-2 bg-gray-900/40 rounded-[2rem] p-8 border border-gray-800 shadow-2xl flex flex-col overflow-hidden backdrop-blur-xl relative">
                                
                                {/* Zero CPU CSS Carousel Progress Bar */}
                                {(reminders || []).length > 2 && (
                                    <div className="absolute top-0 left-0 right-0 h-1 bg-gray-800">
                                        <div className="h-full bg-blue-500 animate-fill-bar"></div>
                                    </div>
                                )}
                                
                                <div className="flex items-center justify-between mb-6 shrink-0 mt-2">
                                    <div className="flex items-center gap-3">
                                      <Bell size={24} className="text-yellow-500"/>
                                      <h3 className="text-sm font-black text-gray-500 uppercase tracking-widest">Active Reminders</h3>
                                    </div>
                                    {(reminders || []).length > 2 && <div className="text-[10px] font-bold text-gray-600 bg-gray-800 px-3 py-1 rounded-full animate-pulse">AUTO-SCROLLING</div>}
                                </div>
                                
                                {/* Carousel Window */}
                                <div className="flex-1 relative overflow-hidden flex flex-col justify-center">
                                    {(reminders || []).length > 0 ? (
                                        <div key={rIndex} className="space-y-4 w-full absolute inset-x-0 fade-switch flex flex-col justify-center h-full">
                                            {getVisibleReminders().map(r => {
                                                let timeStr = "--:--";
                                                if(r && r.time) {
                                                    const parts = r.time.split(':');
                                                    if(parts.length >= 2) {
                                                        const d = new Date(); d.setHours(parseInt(parts[0],10), parseInt(parts[1],10), 0);
                                                        timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                                    }
                                                }
                                                return (
                                                    <div key={r.id} className="bg-gray-950/80 p-5 lg:p-6 rounded-2xl border border-gray-800 shadow-lg flex items-center justify-between">
                                                        <div>
                                                            <p className="text-white font-bold text-xl lg:text-2xl leading-tight">{r.title}</p>
                                                            {r.offset > 0 && <p className="text-gray-600 text-[10px] uppercase font-bold mt-2">Alerts {r.offset}m prior</p>}
                                                        </div>
                                                        <div className="text-right">
                                                            <p className="text-yellow-500 font-mono font-black text-xl lg:text-2xl">{timeStr}</p>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center opacity-50 h-full">
                                            <Bell size={40} className="text-gray-600 mb-4"/>
                                            <p className="text-gray-500 font-bold text-lg">No alarms set</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        function App() {
            // --- UI State ---
            const [githubToken, setGithubToken] = useState(safeGetStorage(GITHUB_TOKEN_KEY) || '');
            const [tokenInput, setTokenInput] = useState('');
            const [isAuthenticating, setIsAuthenticating] = useState(false);
            
            // --- Diagnostic State ---
            const [toast, setToast] = useState(null);
            const showToast = (msg, type = 'info') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            const [data, setData] = useState({ projects: [], clients: [], holidays: [], leaves: [], reminders: [], totalLeaves: 22 });
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('board');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isListOpen, setIsListOpen] = useState(false);
            const [isRemindersOpen, setIsRemindersOpen] = useState(false);
            const [activeProject, setActiveProject] = useState(null);
            const [editingProject, setEditingProject] = useState(null);
            const [showRates, setShowRates] = useState(true);
            const [currentDate, setCurrentDate] = useState(new Date());
            
            const isFirstMount = useRef(true);

            // --- MANUAL PULL FROM CLOUD ---
            const forcePullFromCloud = async (silentMode = false) => {
                if (!githubToken) return;
                const isSilent = silentMode === true; 
                
                const token = safeGetStorage(GITHUB_TOKEN_KEY);
                const gistId = safeGetStorage(LOCAL_GIST_KEY);
                
                if (!gistId) {
                    if (!isSilent) showToast('❌ No Cloud File ID found. Try clicking Push first to create one.', 'error');
                    return;
                }

                if (!isSilent) showToast('Downloading from GitHub...', 'info');
                try {
                    const res = await fetch(`https://api.github.com/gists/${gistId}?t=${Date.now()}`, {
                        headers: { Authorization: `token ${token}` }
                    });
                    
                    if (!res.ok) throw new Error(`GitHub Error ${res.status}`);
                    
                    const gist = await res.json();
                    const content = gist.files[GIST_FILENAME] ? gist.files[GIST_FILENAME].content : null;
                    if (!content) throw new Error('File not found inside your Gist.');
                    
                    const parsedData = JSON.parse(content);
                    setData(parsedData);
                    saveLocalData(parsedData);
                    if (!isSilent) showToast('✅ Success! Downloaded latest cloud data.', 'success');
                    
                } catch (e) {
                    console.error(e);
                    if (!isSilent) showToast(`❌ Pull Failed: ${e.message}`, 'error');
                }
            };

            // --- MANUAL PUSH TO CLOUD ---
            const forcePushToCloud = async () => {
                if (!githubToken) return;
                
                const token = safeGetStorage(GITHUB_TOKEN_KEY);
                let gistId = safeGetStorage(LOCAL_GIST_KEY);
                const dataToSave = { ...data, lastUpdated: Date.now() };
                const content = JSON.stringify(dataToSave, null, 2);
                
                showToast('Uploading to GitHub...', 'info');
                
                try {
                    if (gistId) {
                        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
                            method: 'PATCH',
                            headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ files: { [GIST_FILENAME]: { content } } })
                        });
                        if (!res.ok) throw new Error(`GitHub Error ${res.status}: Check Token Permissions.`);
                        showToast('✅ Success! Overwrote cloud data.', 'success');
                    } else {
                        const res = await fetch('https://api.github.com/gists', {
                            method: 'POST',
                            headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ description: "AnimTrack Cloud Backup", public: false, files: { [GIST_FILENAME]: { content } } })
                        });
                        if (!res.ok) throw new Error(`GitHub Error ${res.status}: Check Token Permissions.`);
                        
                        const gist = await res.json();
                        safeSetStorage(LOCAL_GIST_KEY, gist.id);
                        showToast('✅ Created new Cloud File! Sync enabled.', 'success');
                    }
                    saveLocalData(dataToSave);
                } catch(e) {
                    console.error(e);
                    showToast(`❌ Push Failed: ${e.message}`, 'error');
                }
            };

            // --- Initialization ---
            useEffect(() => {
                if (!githubToken) return;

                const initData = async () => {
                    const cloudData = await fetchCloudData();
                    if (cloudData) {
                        setData(cloudData);
                    } else {
                        setData(loadLocalData());
                    }
                    setLoading(false);
                    setTimeout(() => { isFirstMount.current = false; }, 1000); 
                };
                initData(); 
            }, [githubToken]);

            // --- Local Auto-Save ---
            useEffect(() => { 
                if (isFirstMount.current) return;
                if (!loading && githubToken) {
                    saveLocalData({ ...data, lastUpdated: Date.now() });
                }
            }, [data, loading, githubToken]);

            const statusGroups = useMemo(() => {
                const g = { active: [], completed: [], paid: [] };
                (data.projects || []).forEach(p => {
                    if(p.status === 'paid') g.paid.push(p);
                    else if(p.status === 'completed') g.completed.push(p);
                    else g.active.push(p);
                });
                return g;
            }, [data.projects]);

            const groupedArchive = useMemo(() => {
                const groups = {};
                statusGroups.paid.forEach(p => {
                    const date = parseLocalDate(p.paymentDate || p.createdAt) || new Date();
                    const key = date.toLocaleString('default', { month: 'long', year: 'numeric' });
                    if (!groups[key]) groups[key] = []; groups[key].push(p);
                });
                return Object.fromEntries(Object.entries(groups).sort((a, b) => new Date(b[0]) - new Date(a[0])));
            }, [statusGroups.paid]);

            const groupedDone = useMemo(() => {
                const groups = {};
                statusGroups.completed.forEach(p => { if (!groups[p.client]) groups[p.client] = []; groups[p.client].push(p); });
                return groups;
            }, [statusGroups.completed]);

            const handleUpdateLists = (l) => setData(prev => ({ ...prev, clients: l }));
            const handleUpdateReminders = (r) => setData(prev => ({ ...prev, reminders: r }));
            const handleAddLeave = (l) => setData(prev => ({ ...prev, leaves: [...(prev.leaves || []), l] }));
            const handleDeleteLeave = (id) => setData(prev => ({ ...prev, leaves: (prev.leaves || []).filter(x=>x.id!==id) }));
            const handleUpdateHolidays = (h) => setData(prev => ({ ...prev, holidays: h }));
            const handleUpdateTotalLeaves = (v) => setData(prev => ({ ...prev, totalLeaves: v }));
            
            const handleImport = (d) => { 
                if(d && d.projects) {
                    setData(d); 
                    showToast('Local JSON Imported! Click the Green Upload button to push it to the cloud.', 'info');
                }
            };

            const handleSaveProject = (p) => {
                setData(prev => {
                    const isPaid = p.status === 'paid'; const isCompleted = p.status === 'completed';
                    const projects = prev.projects || [];
                    const list = editingProject ? projects.map(x=>x.id===p.id?{...x, ...p, paymentDate: (isPaid && !x.paymentDate) ? formatDate(new Date()) : x.paymentDate, completionDate: (isCompleted && !x.completionDate) ? formatDate(new Date()) : x.completionDate }:x) : [...projects, {...p, id:crypto.randomUUID(), paymentDate: isPaid ? formatDate(new Date()) : '', completionDate: isCompleted ? formatDate(new Date()) : ''}];
                    return { ...prev, projects: list };
                });
            };

            const handleAdvanceStage = (p) => {
                setData(prev => {
                    const projects = (prev.projects || []).map(x => {
                        if (x.id === p.id) {
                            const curIdx = STATUS_FLOW.indexOf(x.status);
                            const nextStatus = STATUS_FLOW[Math.min(curIdx + 1, STATUS_FLOW.length - 1)];
                            const updates = { status: nextStatus };
                            if (nextStatus === 'completed' && !x.completionDate) updates.completionDate = formatDate(new Date());
                            if (nextStatus === 'paid' && !x.paymentDate) updates.paymentDate = formatDate(new Date());
                            return { ...x, ...updates };
                        }
                        return x;
                    });
                    return { ...prev, projects };
                });
            };

            const handleRevisionNeeded = (p) => {
                setData(prev => {
                    const projects = (prev.projects || []).map(x => (x.id === p.id) ? { ...x, status: 'revision', paymentDate: '', completionDate: '' } : x);
                    return { ...prev, projects };
                });
            };

            const handleRevertStage = (p) => {
                setData(prev => {
                    const projects = (prev.projects || []).map(x => {
                        if (x.id === p.id) {
                            const curIdx = STATUS_FLOW.indexOf(x.status);
                            const nextStatus = STATUS_FLOW[Math.max(0, curIdx - 1)];
                            return { ...x, status: nextStatus, paymentDate: '', completionDate: '' };
                        }
                        return x;
                    });
                    return { ...prev, projects };
                });
            };

            const handleSaveToken = async () => {
                if (!tokenInput.trim()) return;
                setIsAuthenticating(true);
                const token = tokenInput.trim();
                safeSetStorage(GITHUB_TOKEN_KEY, token);
                
                try {
                    const res = await fetch('https://api.github.com/gists', {
                        headers: { Authorization: `token ${token}` }
                    });
                    
                    if (res.ok) {
                        const gists = await res.json();
                        const existingGist = gists.find(g => g.files && g.files[GIST_FILENAME]);
                        if (existingGist) safeSetStorage(LOCAL_GIST_KEY, existingGist.id);
                        setGithubToken(token);
                    } else {
                        alert(`❌ GitHub rejected this Token. Error: ${res.status}\n\nMake sure the token has "Gists" Read/Write permissions.`);
                        safeRemoveStorage(GITHUB_TOKEN_KEY);
                    }
                } catch (e) { 
                    alert(`Network Error: Could not reach GitHub API.\n\n${e.message}`);
                    safeRemoveStorage(GITHUB_TOKEN_KEY);
                }
                
                setIsAuthenticating(false);
            };

            // --- The Authentication Screen ---
            if (!githubToken) {
                return (
                    <div className="fixed inset-0 bg-gray-950 flex flex-col items-center justify-center p-4">
                        <div className="bg-gray-900 border border-gray-800 p-8 rounded-3xl max-w-md w-full shadow-2xl space-y-6 fade-in">
                            <div className="w-16 h-16 bg-blue-500/10 rounded-2xl flex items-center justify-center mx-auto mb-2 border border-blue-500/20 shadow-inner">
                                <CheckCircle className="text-blue-500" size={32} />
                            </div>
                            <h2 className="text-2xl font-bold text-white text-center">Secure Cloud Sync</h2>
                            <p className="text-gray-400 text-sm text-center">Enter your GitHub PAT to continue. Make sure the token has <b className="text-white">Gists (Read & Write)</b> permissions enabled.</p>
                            
                            <div className="space-y-2">
                                <input 
                                    type="password" 
                                    value={tokenInput}
                                    onChange={e => setTokenInput(e.target.value)}
                                    disabled={isAuthenticating}
                                    className="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-white text-sm outline-none focus:border-blue-500 text-center font-mono disabled:opacity-50" 
                                    placeholder="ghp_xxxxxxxxxxxxxxxxx" 
                                    onKeyDown={e => { if(e.key === 'Enter') handleSaveToken(); }}
                                />
                            </div>

                            <button onClick={handleSaveToken} disabled={isAuthenticating} className="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl font-bold text-sm shadow-lg transition disabled:opacity-50">
                                {isAuthenticating ? 'Connecting to GitHub...' : 'Authenticate & Sync'}
                            </button>
                        </div>
                    </div>
                );
            }

            if (loading) return null;

            return (
                <div className="fixed inset-0 bg-gray-950 flex flex-col">
                    
                    {/* GLOBAL TOAST NOTIFICATION */}
                    {toast && view !== 'screensaver' && (
                        <div className={`fixed bottom-6 right-6 px-6 py-4 rounded-2xl shadow-2xl border z-50 flex items-center gap-3 slide-up ${toast.type === 'error' ? 'bg-red-950/90 border-red-900 text-red-200' : toast.type === 'success' ? 'bg-emerald-950/90 border-emerald-900 text-emerald-200' : 'bg-gray-800/90 border-gray-700 text-white'}`}>
                            <Box size={20} className={toast.type === 'error' ? 'text-red-500' : toast.type === 'success' ? 'text-emerald-500' : 'text-blue-500'}/>
                            <p className="text-sm font-bold">{toast.msg}</p>
                        </div>
                    )}

                    {view !== 'screensaver' && (
                        <header className="h-16 bg-gray-900/80 backdrop-blur-xl border-b border-gray-800 flex items-center justify-between px-6 z-40">
                            <div className="flex items-center gap-6">
                                <div className="flex items-center gap-3"><Box className="text-blue-500" size={24}/><h1 className="text-lg font-black text-white uppercase tracking-widest">ANIM<span className="text-blue-500">TRACK</span></h1></div>
                                <div className="flex bg-gray-950/50 p-1 rounded-2xl border border-gray-800 shadow-inner hidden md:flex">
                                    <button onClick={()=>setView('board')} className={`p-2 px-4 rounded-xl transition ${view==='board'?'bg-gray-800 text-white shadow-xl':'text-gray-500 hover:text-gray-400'}`}><LayoutGrid size={16}/></button>
                                    <button onClick={()=>setView('calendar')} className={`p-2 px-4 rounded-xl transition ${view==='calendar'?'bg-gray-800 text-white shadow-xl':'text-gray-500 hover:text-gray-400'}`}><CalendarDays size={16}/></button>
                                    <button onClick={()=>setView('stats')} className={`p-2 px-4 rounded-xl transition ${view==='stats'?'bg-gray-800 text-white shadow-xl':'text-gray-500 hover:text-gray-400'}`}><BarChart2 size={16}/></button>
                                    <button onClick={()=>setView('leaves')} className={`p-2 px-4 rounded-xl transition ${view==='leaves'?'bg-gray-800 text-white shadow-xl':'text-gray-500 hover:text-gray-400'}`}><Umbrella size={16}/></button>
                                    <button onClick={()=>setView('screensaver')} className={`p-2 px-4 rounded-xl transition text-gray-500 hover:text-gray-400 ml-2`} title="TV Dashboard Mode"><Monitor size={16}/></button>
                                </div>
                            </div>
                            {view === 'calendar' && (
                                <div className="flex items-center gap-3 bg-gray-950/80 px-2 py-1 rounded-2xl border border-gray-800 shadow-lg hidden lg:flex">
                                    <button onClick={()=>setCurrentDate(prev => { const d = new Date(prev); d.setMonth(d.getMonth()-1); return d; })} className="p-1.5 hover:bg-gray-800 rounded-lg text-gray-500 transition"><ChevronLeft size={18}/></button>
                                    <span className="text-[10px] font-black uppercase text-gray-200 min-w-[120px] text-center tracking-widest">{currentDate.toLocaleString('default', { month: 'long', year: 'numeric' })}</span>
                                    <button onClick={()=>setCurrentDate(prev => { const d = new Date(prev); d.setMonth(d.getMonth()+1); return d; })} className="p-1.5 hover:bg-gray-800 rounded-lg text-gray-500 transition"><ChevronRight size={18}/></button>
                                </div>
                            )}
                            <div className="flex items-center gap-2">
                                <button onClick={()=>setShowRates(!showRates)} className="w-10 h-10 flex items-center justify-center bg-gray-800/50 border border-gray-700 rounded-2xl text-gray-400 hover:text-white transition shadow-sm hidden sm:flex">{showRates?<Eye size={18}/>:<EyeOff size={18}/>}</button>
                                
                                {/* ALARMS BUTTON */}
                                <button onClick={()=>setIsRemindersOpen(true)} className="w-10 h-10 flex items-center justify-center bg-gray-800/50 border border-gray-700 rounded-2xl text-yellow-500 hover:text-yellow-400 hover:bg-gray-800 transition shadow-sm relative" title="Notifications & Timers">
                                    <Bell size={18}/>
                                    {(data.reminders || []).length > 0 && <span className="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border border-gray-900"></span>}
                                </button>
                                
                                {/* MANUAL SYNC CONTROLS */}
                                <div className="flex bg-gray-900 border border-gray-800 rounded-2xl p-1 shadow-inner">
                                    <button onClick={() => forcePullFromCloud(false)} className="w-8 h-8 flex items-center justify-center rounded-xl text-blue-400 hover:bg-gray-800 hover:text-blue-300 transition" title="Pull Latest Data from GitHub">
                                        <Download size={14} />
                                    </button>
                                    <div className="w-px h-5 bg-gray-800 my-auto mx-1"></div>
                                    <button onClick={forcePushToCloud} className="w-8 h-8 flex items-center justify-center rounded-xl text-emerald-400 hover:bg-gray-800 hover:text-emerald-300 transition" title="Force Push to GitHub">
                                        <Upload size={14} />
                                    </button>
                                </div>

                                <button onClick={()=>setIsListOpen(true)} className="w-10 h-10 flex items-center justify-center bg-gray-800/50 border border-gray-700 rounded-2xl text-gray-400 hover:text-white transition shadow-sm"><Settings size={18}/></button>
                                <button onClick={()=>{setEditingProject(null); setIsModalOpen(true);}} className="bg-blue-600 hover:bg-blue-500 text-white h-10 px-5 ml-1 rounded-2xl flex items-center shadow-lg transition font-bold uppercase text-[10px] tracking-widest">New Ticket</button>
                            </div>
                        </header>
                    )}

                    <main className="flex-1 relative overflow-hidden bg-gray-950">
                        {view === 'board' && (
                            <div className="h-full overflow-y-auto p-6 space-y-8 custom-scrollbar">
                                <div className="space-y-4">
                                    <div className="flex items-center gap-3 border-b border-gray-800/50 pb-2 uppercase text-[10px] font-black text-gray-500 tracking-widest">In Progress</div>
                                    <div className="flex gap-4 overflow-x-auto pb-4 no-scrollbar">
                                        {statusGroups.active.map(p => (
                                            <ProjectCard 
                                                key={p.id} 
                                                p={p} 
                                                clients={data.clients} 
                                                showRates={showRates} 
                                                onEdit={(proj)=>{setEditingProject(proj); setIsModalOpen(true);}} 
                                                onSelect={()=>setActiveProject(p)} 
                                                onAdvance={handleAdvanceStage} 
                                                onRevision={handleRevisionNeeded}
                                                onUpdate={(id, up)=>setData(prev => ({...prev, projects: (prev.projects || []).map(x=>x.id===id?{...x, ...up}:x)}))}
                                            />
                                        ))}
                                    </div>
                                </div>
                                <div className="space-y-4">
                                    <div className="flex items-center gap-3 border-b border-gray-800/50 pb-2 uppercase text-[10px] font-black text-gray-500 tracking-widest text-yellow-500">Done / Pending Pay</div>
                                    <div className="flex gap-4 overflow-x-auto pb-4 no-scrollbar">
                                        {Object.entries(groupedDone).map(([client, items]) => (
                                            <div key={client} className="bg-gray-900 border border-gray-800 p-5 rounded-3xl min-w-[300px] shrink-0 space-y-4 hover:border-gray-600 transition shadow-xl relative overflow-hidden text-white">
                                                <div className="flex items-center gap-2 border-b border-gray-800 pb-2"><Briefcase size={12} className="text-yellow-500"/><h4 className="text-[10px] font-black uppercase tracking-widest truncate">{client}</h4></div>
                                                <div className="space-y-2">
                                                    {items.map(item => (
                                                        <div key={item.id} className="flex justify-between items-center group/item hover:bg-gray-800/50 p-2 rounded-xl transition cursor-pointer" onClick={()=>setActiveProject(item)}>
                                                            <div className="min-w-0 pr-2"><p className="text-[11px] font-bold text-gray-300 truncate">{item.name}</p><p className="text-[9px] text-gray-500 font-mono tracking-tighter">{showRates ? `$${calculateTicketValue(item, data.clients).toLocaleString()}` : '****'}</p></div>
                                                            <div className="flex gap-1 opacity-0 group-hover/item:opacity-100 transition shrink-0">
                                                                <button onClick={(e)=>{e.stopPropagation(); handleRevertStage(item);}} className="p-1.5 bg-gray-800 rounded-lg text-orange-400 hover:bg-gray-700 transition"><RotateCcw size={12}/></button>
                                                                <button onClick={(e)=>{e.stopPropagation(); handleAdvanceStage(item);}} className="p-1.5 bg-gray-800 rounded-lg text-emerald-400 hover:bg-gray-700 transition"><ArrowRight size={12}/></button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="space-y-4">
                                    <div className="flex items-center gap-3 border-b border-gray-800/50 pb-2 uppercase text-[10px] font-black text-gray-500 tracking-widest text-emerald-500">Archive</div>
                                    <div className="space-y-6">
                                        {Object.entries(groupedArchive).map(([month, items]) => (
                                            <div key={month} className="space-y-2">
                                                <h4 className="text-[10px] font-black text-emerald-500/60 uppercase tracking-widest ml-1">{month}</h4>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
                                                    {items.map(p => (
                                                        <div key={p.id} onClick={()=>setActiveProject(p)} className="bg-gray-900 border border-gray-800 p-3 rounded-2xl flex justify-between items-center hover:border-gray-600 transition cursor-pointer shadow-md active:scale-95 text-white">
                                                            <div className="min-w-0 pr-2">
                                                                <p className="text-[9px] font-bold text-gray-500 uppercase truncate">{p.client}</p>
                                                                <h4 className="text-xs font-bold truncate leading-tight">{p.name}</h4>
                                                            </div>
                                                            <div className="text-right shrink-0"><span className="text-xs font-mono font-bold text-emerald-400">{showRates ? `$${calculateTicketValue(p, data.clients).toLocaleString()}` : '****'}</span></div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                        {view === 'calendar' && <CalendarBoard projects={data.projects} currentDate={currentDate} onEdit={(p)=>{setEditingProject(p); setIsModalOpen(true);}} holidays={data.holidays} leaves={data.leaves} />}
                        {view === 'stats' && <StatisticsView projects={data.projects} clients={data.clients} leaves={data.leaves} totalLeaves={data.totalLeaves} showRates={showRates} />}
                        {view === 'leaves' && <TimeOffView leaves={data.leaves} holidays={data.holidays} totalLeaves={data.totalLeaves} onAddLeave={handleAddLeave} onDeleteLeave={handleDeleteLeave} onUpdateHolidays={handleUpdateHolidays} onUpdateTotalLeaves={handleUpdateTotalLeaves} />}
                        
                        {/* THE SCREENSAVER */}
                        {view === 'screensaver' && <ScreensaverView projects={data.projects} reminders={data.reminders} onExit={() => setView('board')} onAutoSync={forcePullFromCloud} />}
                    </main>
                    
                    {/* Mobile Nav Tabs (Visible only on small screens) */}
                    {view !== 'screensaver' && (
                        <div className="md:hidden flex bg-gray-900/90 backdrop-blur-xl border-t border-gray-800 p-2 safe-area-bottom justify-around z-40">
                            <button onClick={()=>setView('board')} className={`p-3 rounded-2xl flex flex-col items-center gap-1 flex-1 ${view==='board'?'text-blue-500':'text-gray-500'}`}><LayoutGrid size={20}/></button>
                            <button onClick={()=>setView('calendar')} className={`p-3 rounded-2xl flex flex-col items-center gap-1 flex-1 ${view==='calendar'?'text-blue-500':'text-gray-500'}`}><CalendarDays size={20}/></button>
                            <button onClick={()=>setView('stats')} className={`p-3 rounded-2xl flex flex-col items-center gap-1 flex-1 ${view==='stats'?'text-blue-500':'text-gray-500'}`}><BarChart2 size={20}/></button>
                            <button onClick={()=>setView('leaves')} className={`p-3 rounded-2xl flex flex-col items-center gap-1 flex-1 ${view==='leaves'?'text-blue-500':'text-gray-500'}`}><Umbrella size={20}/></button>
                            <button onClick={()=>setView('screensaver')} className={`p-3 rounded-2xl flex flex-col items-center gap-1 flex-1 text-gray-500`}><Monitor size={20}/></button>
                        </div>
                    )}

                    <ProjectModal isOpen={isModalOpen} onClose={()=>setIsModalOpen(false)} onSave={handleSaveProject} onDelete={(id)=>setData(prev=>({...prev, projects:(prev.projects || []).filter(x=>x.id!==id)}))} initialData={editingProject} clients={data.clients} />
                    <ListManager isOpen={isListOpen} onClose={()=>setIsListOpen(false)} onUpdateLists={handleUpdateLists} initialClients={data.clients} allData={data} onImport={handleImport} />
                    <RemindersManager isOpen={isRemindersOpen} onClose={()=>setIsRemindersOpen(false)} reminders={data.reminders} onUpdateReminders={handleUpdateReminders} />
                    {activeProject && <ProjectDetails project={activeProject} onClose={()=>setActiveProject(null)} onEdit={()=>{ setEditingProject(activeProject); setIsModalOpen(true); setActiveProject(null); }} onAdvance={handleAdvanceStage} onRevert={handleRevertStage} onRevision={handleRevisionNeeded} onUpdate={(id, up)=>setData(prev => ({...prev, projects: (prev.projects || []).map(x=>x.id===id?{...x, ...up}:x)}))} />}
                </div>
            );
        }
        const root = createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
