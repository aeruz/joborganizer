        // --- 4K TV DASHBOARD (SCREENSAVER) ---
        const ScreensaverView = ({ projects, reminders, onExit, onAutoSync }) => {
            const [time, setTime] = useState(new Date());
            const [weather, setWeather] = useState({ temp: '--', condition: 'Updating...' });
            const [activeAlarm, setActiveAlarm] = useState(null);
            
            // Memory flag so alarm only fires once per day
            const triggeredAlarms = useRef({});

            // 1. Core Clock & Sync Engine
            useEffect(() => {
                const clockTimer = setInterval(() => setTime(new Date()), 1000);
                const syncTimer = setInterval(() => onAutoSync(true), 60000); // Silent auto-sync every 60s
                
                return () => {
                    clearInterval(clockTimer);
                    clearInterval(syncTimer);
                };
            }, [onAutoSync]);

            // 2. Alarm Trigger Engine (Checks every 10 seconds)
            useEffect(() => {
                const alarmCheck = setInterval(() => {
                    const now = new Date();
                    const currentMins = now.getHours() * 60 + now.getMinutes();
                    const todayStr = now.toDateString();

                    (reminders || []).forEach(r => {
                        if (!r.time) return;
                        const [hr, min] = r.time.split(':').map(Number);
                        const eventMins = hr * 60 + min;
                        const alertMins = eventMins - (r.offset || 0);

                        // If we hit the minute, trigger it
                        if (currentMins >= alertMins && currentMins < eventMins) {
                            const triggerKey = `${r.id}-${todayStr}`;
                            if (!triggeredAlarms.current[triggerKey]) {
                                triggeredAlarms.current[triggerKey] = true;
                                // Convert 24hr to 12hr for display
                                const d = new Date(); d.setHours(hr, min, 0);
                                const eventTimeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                
                                setActiveAlarm({ ...r, eventTimeStr });
                                
                                // Auto dismiss the giant alert after 1 minute so it doesn't burn into the TV
                                setTimeout(() => setActiveAlarm(null), 60000);
                            }
                        }
                    });
                }, 10000);
                return () => clearInterval(alarmCheck);
            }, [reminders]);

            // 3. Weather Fetcher (Cebu City API - Updates every 30 mins)
            useEffect(() => {
                const fetchWeather = async () => {
                    try {
                        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=10.3157&longitude=123.8854&current_weather=true');
                        if (res.ok) {
                            const data = await res.json();
                            const code = data.current_weather.weathercode;
                            let desc = 'Clear';
                            if(code > 0 && code <= 3) desc = 'Cloudy';
                            else if(code >= 45 && code <= 48) desc = 'Foggy';
                            else if(code >= 51 && code <= 67) desc = 'Rainy';
                            else if(code >= 71 && code <= 77) desc = 'Snowy';
                            else if(code >= 95) desc = 'Thunderstorm';
                            setWeather({ temp: `${Math.round(data.current_weather.temperature)}°C`, condition: desc });
                        }
                    } catch(e) {}
                };
                fetchWeather();
                const weatherTimer = setInterval(fetchWeather, 30 * 60 * 1000);
                return () => clearInterval(weatherTimer);
            }, []);

            // Get Priority Project
            const activeProject = useMemo(() => {
                const active = (projects || []).filter(p => !['paid', 'completed'].includes(p.status));
                const inProgress = active.filter(p => p.progress > 0 && p.progress < 100);
                if (inProgress.length > 0) return [...inProgress].sort((a,b) => (b.progress || 0) - (a.progress || 0))[0];
                return active[active.length - 1] || null;
            }, [projects]);

            // Build TV Calendar Data
            const tvCalendar = useMemo(() => {
                const startM = new Date(time.getFullYear(), time.getMonth(), 1);
                const startD = new Date(startM); startD.setDate(startD.getDate() - startD.getDay());
                const endM = new Date(time.getFullYear(), time.getMonth() + 1, 0);
                const endD = new Date(endM); if (endD.getDay() !== 6) endD.setDate(endD.getDate() + (6 - endD.getDay()));
                
                const w = []; let iter = new Date(startD);
                while (iter <= endD || w.length < 5) {
                    let week = [];
                    for(let i=0; i<7; i++){ week.push(new Date(iter)); iter.setDate(iter.getDate()+1); }
                    w.push(week);
                }
                return w;
            }, [time.getMonth()]);

            return (
                <div className="fixed inset-0 bg-[#030712] z-[100] p-6 lg:p-12 flex flex-col cursor-default fade-in overflow-hidden">
                    
                    {/* ALARM OVERLAY */}
                    {activeAlarm && (
                        <div className="fixed inset-0 z-[200] bg-red-950/95 flex flex-col items-center justify-center fade-in backdrop-blur-md">
                            <div className="absolute inset-0 bg-red-500/20 pulse-slow mix-blend-overlay"></div>
                            <Bell size={120} className="text-red-500 mb-8 animate-bounce drop-shadow-[0_0_30px_rgba(239,68,68,0.8)]" />
                            <h1 className="text-7xl font-black text-white mb-6 uppercase tracking-widest text-center">Reminder</h1>
                            <p className="text-5xl lg:text-7xl font-bold text-red-200 text-center max-w-4xl leading-tight">{activeAlarm.title}</p>
                            <p className="text-3xl text-red-400 mt-6 font-mono font-bold tracking-tight">Scheduled Event: {activeAlarm.eventTimeStr}</p>
                            <button onClick={()=>setActiveAlarm(null)} className="mt-16 px-12 py-6 bg-red-600 rounded-3xl text-white text-3xl font-black tracking-widest hover:scale-105 transition shadow-2xl relative z-10">DISMISS</button>
                        </div>
                    )}

                    {/* Exit Button - Positioned absolutely to top-right corner to prevent layout shifting */}
                    <button onClick={onExit} className="absolute top-6 right-6 p-2 text-gray-600 hover:text-white transition group flex items-center gap-2 z-50">
                        <span className="text-xs font-bold uppercase tracking-widest opacity-0 group-hover:opacity-100 transition">Exit Dashboard</span>
                        <X size={32} />
                    </button>
                    
                    {/* HEADER: CLOCK & WEATHER */}
                    <div className="flex justify-between items-start mb-8 lg:mb-12 shrink-0 relative z-10">
                         <div>
                             <h1 className="text-7xl lg:text-[8rem] font-black text-white leading-none tracking-tighter" style={{ textShadow: '0 0 40px rgba(255,255,255,0.05)' }}>
                                 {time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }).replace(/(AM|PM)/, '').trim()}
                                 <span className="text-4xl lg:text-6xl text-gray-500 ml-4 tracking-normal uppercase">{time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }).slice(-2)}</span>
                             </h1>
                             <p className="text-2xl lg:text-4xl text-blue-500 font-bold tracking-tight mt-2">{time.toLocaleDateString('default', { weekday: 'long', month: 'long', day: 'numeric' })}</p>
                         </div>
                         <div className="text-right flex flex-col items-end pt-2 pr-12">
                             <div className="flex items-center gap-4 text-4xl lg:text-6xl font-black text-yellow-500"><Cloud size={48} className="text-gray-500"/> {weather.temp}</div>
                             <p className="text-xl lg:text-2xl text-gray-500 font-bold uppercase tracking-widest mt-2">{weather.condition}</p>
                         </div>
                    </div>

                    {/* GRID: SHOT PROGRESS & CALENDAR */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 lg:gap-8 flex-1 h-full min-h-0 pb-4">
                         
                         {/* LEFT: Active Project Dashboard */}
                         <div className="col-span-2 bg-gray-900/40 rounded-[2rem] lg:rounded-[3rem] p-8 lg:p-12 border border-gray-800 shadow-2xl flex flex-col justify-center relative overflow-hidden backdrop-blur-xl">
                            {/* Ambient Glow */}
                            <div className="absolute top-0 right-0 w-96 h-96 bg-blue-500/5 rounded-full blur-3xl -z-10 mix-blend-screen pointer-events-none"></div>
                            
                            {activeProject ? (
                                <div className="space-y-8 lg:space-y-12 relative z-10">
                                    <div className="flex justify-between items-start">
                                        <div className="pr-4">
                                            <div className="flex items-center gap-3 mb-2 lg:mb-4">
                                                <Briefcase size={24} className="text-blue-500" />
                                                <p className="text-blue-400 font-black uppercase tracking-widest text-lg lg:text-2xl">{activeProject.client}</p>
                                            </div>
                                            <h2 className="text-5xl lg:text-7xl font-black text-white leading-tight line-clamp-2" title={activeProject.name}>{activeProject.name}</h2>
                                        </div>
                                        <div className="text-right shrink-0">
                                            <p className="text-gray-500 font-black uppercase tracking-widest text-xs lg:text-sm mb-2 lg:mb-3">Pipeline Status</p>
                                            <div className={`px-4 lg:px-6 py-2 rounded-xl lg:rounded-2xl border text-lg lg:text-2xl font-black uppercase inline-block shadow-lg ${getStatusStyles(activeProject.status)}`}>{activeProject.status}</div>
                                        </div>
                                    </div>
                                    
                                    <div className="space-y-4 pt-4 lg:pt-8">
                                        <div className="flex justify-between text-xl lg:text-3xl font-bold text-gray-400 uppercase tracking-widest">
                                            <span>Current Progress</span>
                                            <span className="text-white font-black">{activeProject.progress || 0}%</span>
                                        </div>
                                        <div className="w-full bg-gray-950 h-6 lg:h-10 rounded-full overflow-hidden border border-gray-800 shadow-inner">
                                            <div 
                                                className="h-full bg-blue-500 shadow-[0_0_40px_rgba(59,130,246,0.6)] transition-all duration-1000 ease-out relative" 
                                                style={{ width: `${activeProject.progress || 0}%` }}
                                            >
                                                <div className="absolute inset-0 bg-white/20 w-full h-full" style={{ background: 'linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent)' }}></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="text-center py-10 relative z-10">
                                    <div className="w-24 h-24 bg-gray-800/50 rounded-full flex items-center justify-center mx-auto mb-6"><Target size={40} className="text-gray-600"/></div>
                                    <h2 className="text-4xl lg:text-5xl font-black text-gray-500 tracking-tight">No Active Shots</h2>
                                    <p className="text-gray-600 mt-4 text-xl lg:text-2xl font-medium">Dashboard is waiting for a new ticket to track.</p>
                                </div>
                            )}
                         </div>

                         {/* RIGHT: Calendar & Reminders Layout */}
                         <div className="flex flex-col gap-6 lg:gap-8 h-full min-h-0">
                              
                              {/* Mini TV Calendar */}
                              <div className="bg-gray-900/40 rounded-[2rem] p-6 lg:p-8 border border-gray-800 shadow-xl backdrop-blur-xl shrink-0">
                                  <h3 className="text-xs lg:text-sm font-black text-gray-500 uppercase tracking-widest mb-4 text-center">{time.toLocaleString('default', { month: 'long', year: 'numeric' })}</h3>
                                  <div className="grid grid-cols-7 gap-1 mb-2">
                                      {['S','M','T','W','T','F','S'].map((d,i)=><div key={i} className="text-center text-[10px] lg:text-xs font-black text-gray-600 uppercase">{d}</div>)}
                                  </div>
                                  <div className="grid grid-cols-7 gap-1 lg:gap-2">
                                      {tvCalendar.flat().map((day, dIdx) => {
                                          const isToday = day.toDateString() === time.toDateString();
                                          const isOtherMonth = day.getMonth() !== time.getMonth();
                                          
                                          // Check if any project has a deadline today
                                          const hasDeadline = (projects || []).some(p => {
                                              if(!p.deadline || ['paid', 'completed'].includes(p.status)) return false;
                                              const d = parseLocalDate(p.deadline);
                                              return d && d.toDateString() === day.toDateString();
                                          });

                                          return (
                                              <div key={dIdx} className={`aspect-square flex flex-col items-center justify-center rounded-lg relative ${isOtherMonth ? 'opacity-20' : ''} ${isToday ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-400'}`}>
                                                  <span className={`text-sm lg:text-base font-bold ${isToday ? 'text-white' : 'text-gray-300'}`}>{day.getDate()}</span>
                                                  {hasDeadline && <div className={`w-1.5 h-1.5 rounded-full absolute bottom-1.5 ${isToday ? 'bg-white' : 'bg-red-500 shadow-[0_0_5px_rgba(239,68,68,0.8)]'}`}></div>}
                                              </div>
                                          );
                                      })}
                                  </div>
                              </div>

                              {/* Today's Alarms */}
                              <div className="bg-gray-900/40 rounded-[2rem] p-6 lg:p-8 border border-gray-800 shadow-xl flex-1 flex flex-col overflow-hidden backdrop-blur-xl">
                                  <div className="flex items-center gap-3 mb-6 shrink-0">
                                      <Bell size={20} className="text-yellow-500"/>
                                      <h3 className="text-xs lg:text-sm font-black text-gray-500 uppercase tracking-widest">Active Reminders</h3>
                                  </div>
                                  <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-4">
                                      {(reminders || []).map(r => {
                                          const [h, m] = r.time.split(':').map(Number);
                                          const d = new Date(); d.setHours(h, m, 0);
                                          const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                          
                                          return (
                                              <div key={r.id} className="bg-gray-950/50 p-4 rounded-xl border border-gray-800/50">
                                                  <p className="text-yellow-500 font-mono font-bold text-xs lg:text-sm mb-1">{timeStr}</p>
                                                  <p className="text-white font-bold text-base lg:text-lg leading-tight">{r.title}</p>
                                                  {r.offset > 0 && <p className="text-gray-600 text-[9px] uppercase font-bold mt-2">Alerts {r.offset}m prior</p>}
                                              </div>
                                          );
                                      })}
                                      {(reminders || []).length === 0 && (
                                          <div className="h-full flex flex-col items-center justify-center opacity-50">
                                              <Bell size={32} className="text-gray-600 mb-2"/>
                                              <p className="text-gray-500 font-bold text-sm lg:text-base">No alarms set</p>
                                          </div>
                                      )}
                                  </div>
                              </div>

                         </div>
                    </div>
                </div>
            );
        };

        function App() {
            // --- UI State ---
            const [githubToken, setGithubToken] = useState(safeGetStorage(GITHUB_TOKEN_KEY) || '');
            const [tokenInput, setTokenInput] = useState('');
            const [isAuthenticating, setIsAuthenticating] = useState(false);
            
            // --- Diagnostic State ---
            const [toast, setToast] = useState(null);
            const showToast = (msg, type = 'info') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            const [data, setData] = useState({ projects: [], clients: [], holidays: [], leaves: [], reminders: [], totalLeaves: 22 });
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('board');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isListOpen, setIsListOpen] = useState(false);
            const [isRemindersOpen, setIsRemindersOpen] = useState(false);
            const [activeProject, setActiveProject] = useState(null);
            const [editingProject, setEditingProject] = useState(null);
            const [showRates, setShowRates] = useState(true);
            const [currentDate, setCurrentDate] = useState(new Date());
            
            const isFirstMount = useRef(true);

            // --- MANUAL PULL FROM CLOUD ---
            const forcePullFromCloud = async (silentMode = false) => {
                if (!githubToken) return;
                const isSilent = silentMode === true; 
                
                const token = safeGetStorage(GITHUB_TOKEN_KEY);
                const gistId = safeGetStorage(LOCAL_GIST_KEY);
                
                if (!gistId) {
                    if (!isSilent) showToast('❌ No Cloud File ID found. Try clicking Push first to create one.', 'error');
                    return;
                }

                if (!isSilent) showToast('Downloading from GitHub...', 'info');
                try {
                    const res = await fetch(`https://api.github.com/gists/${gistId}?t=${Date.now()}`, {
                        headers: { Authorization: `token ${token}` }
                    });
                    
                    if (!res.ok) throw new Error(`GitHub Error ${res.status}`);
                    
                    const gist = await res.json();
                    const content = gist.files[GIST_FILENAME]?.content;
                    if (!content) throw new Error('File not found inside your Gist.');
                    
                    const parsedData = JSON.parse(content);
                    setData(parsedData);
                    saveLocalData(parsedData);
                    if (!isSilent) showToast('✅ Success! Downloaded latest cloud data.', 'success');
                    
                } catch (e) {
                    console.error(e);
                    if (!isSilent) showToast(`❌ Pull Failed: ${e.message}`, 'error');
                }
            };

            // --- MANUAL PUSH TO CLOUD ---
            const forcePushToCloud = async () => {
                if (!githubToken) return;
                
                const token = safeGetStorage(GITHUB_TOKEN_KEY);
                let gistId = safeGetStorage(LOCAL_GIST_KEY);
                const dataToSave = { ...data, lastUpdated: Date.now() };
                const content = JSON.stringify(dataToSave, null, 2);
                
                showToast('Uploading to GitHub...', 'info');
                
                try {
                    if (gistId) {
                        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
                            method: 'PATCH',
                            headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ files: { [GIST_FILENAME]: { content } } })
                        });
                        if (!res.ok) throw new Error(`GitHub Error ${res.status}: Check Token Permissions.`);
                        showToast('✅ Success! Overwrote cloud data.', 'success');
                    } else {
                        const res = await fetch('https://api.github.com/gists', {
                            method: 'POST',
                            headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ description: "AnimTrack Cloud Backup", public: false, files: { [GIST_FILENAME]: { content } } })
                        });
                        if (!res.ok) throw new Error(`GitHub Error ${res.status}: Check Token Permissions.`);
                        
                        const gist = await res.json();
                        safeSetStorage(LOCAL_GIST_KEY, gist.id);
                        showToast('✅ Created new Cloud File! Sync enabled.', 'success');
                    }
                    saveLocalData(dataToSave);
                } catch(e) {
                    console.error(e);
                    showToast(`❌ Push Failed: ${e.message}`, 'error');
                }
            };

            // --- Initialization ---
            useEffect(() => {
                if (!githubToken) return;

                const initData = async () => {
                    const cloudData = await fetchCloudData();
                    if (cloudData) {
                        setData(cloudData);
                    } else {
                        setData(loadLocalData());
                    }
                    setLoading(false);
                    setTimeout(() => { isFirstMount.current = false; }, 1000); 
                };
                initData(); 
            }, [githubToken]);

            // --- Local Auto-Save ---
            useEffect(() => { 
                if (isFirstMount.current) return;
                if (!loading && githubToken) {
                    saveLocalData({ ...data, lastUpdated: Date.now() });
                }
            }, [data, loading, githubToken]);

            const statusGroups = useMemo(() => {
                const g = { active: [], completed: [], paid: [] };
                (data.projects || []).forEach(p => {
                    if(p.status === 'paid') g.paid.push(p);
                    else if(p.status === 'completed') g.completed.push(p);
                    else g.active.push(p);
                });
                return g;
            }, [data.projects]);

            const groupedArchive = useMemo(() => {
                const groups = {};
                statusGroups.paid.forEach(p => {
                    const date = parseLocalDate(p.paymentDate || p.createdAt) || new Date();
                    const key = date.toLocaleString('default', { month: 'long', year: 'numeric' });
                    if (!groups[key]) groups[key] = []; groups[key].push(p);
                });
                return Object.fromEntries(Object.entries(groups).sort((a, b) => new Date(b[0]) - new Date(a[0])));
            }, [statusGroups.paid]);

            const groupedDone = useMemo(() => {
                const groups = {};
                statusGroups.completed.forEach(p => { if (!groups[p.client]) groups[p.client] = []; groups[p.client].push(p); });
                return groups;
            }, [statusGroups.completed]);

            const handleUpdateLists = (l) => setData(prev => ({ ...prev, clients: l }));
            const handleUpdateReminders = (r) => setData(prev => ({ ...prev, reminders: r }));
            const handleAddLeave = (l) => setData(prev => ({ ...prev, leaves: [...(prev.leaves || []), l] }));
            const handleDeleteLeave = (id) => setData(prev => ({ ...prev, leaves: (prev.leaves || []).filter(x=>x.id!==id) }));
            const handleUpdateHolidays = (h) => setData(prev => ({ ...prev, holidays: h }));
            const handleUpdateTotalLeaves = (v) => setData(prev => ({ ...prev, totalLeaves: v }));
            
            const handleImport = (d) => { 
                if(d && d.projects) {
                    setData(d); 
                    showToast('Local JSON Imported! Click the Green Upload button to push it to the cloud.', 'info');
                }
            };

            const handleSaveProject = (p) => {
                setData(prev => {
                    const isPaid = p.status === 'paid'; const isCompleted = p.status === 'completed';
                    const projects = prev.projects || [];
                    const list = editingProject ? projects.map(x=>x.id===p.id?{...x, ...p, paymentDate: (isPaid && !x.paymentDate) ? formatDate(new Date()) : x.paymentDate, completionDate: (isCompleted && !x.completionDate) ? formatDate(new Date()) : x.completionDate }:x) : [...projects, {...p, id:crypto.randomUUID(), paymentDate: isPaid ? formatDate(new Date()) : '', completionDate: isCompleted ? formatDate(new Date()) : ''}];
                    return { ...prev, projects: list };
                });
            };

            const handleAdvanceStage = (p) => {
                setData(prev => {
                    const projects = (prev.projects || []).map(x => {
                        if (x.id === p.id) {
                            const curIdx = STATUS_FLOW.indexOf(x.status);
                            const nextStatus = STATUS_FLOW[Math.min(curIdx + 1, STATUS_FLOW.length - 1)];
                            const updates = { status: nextStatus };
                            if (nextStatus === 'completed' && !x.completionDate) updates.completionDate = formatDate(new Date());
                            if (nextStatus === 'paid' && !x.paymentDate) updates.paymentDate = formatDate(new Date());
                            return { ...x, ...updates };
                        }
                        return x;
                    });
                    return { ...prev, projects };
                });
            };

            const handleRevisionNeeded = (p) => {
                setData(prev => {
                    const projects = (prev.projects || []).map(x => (x.id === p.id) ? { ...x, status: 'revision', paymentDate: '', completionDate: '' } : x);
                    return { ...prev, projects };
                });
            };

            const handleRevertStage = (p) => {
                setData(prev => {
                    const projects = (prev.projects || []).map(x => {
                        if (x.id === p.id) {
                            const curIdx = STATUS_FLOW.indexOf(x.status);
                            const nextStatus = STATUS_FLOW[Math.max(0, curIdx - 1)];
                            return { ...x, status: nextStatus, paymentDate: '', completionDate: '' };
                        }
                        return x;
                    });
                    return { ...prev, projects };
                });
            };

            const handleSaveToken = async () => {
                if (!tokenInput.trim()) return;
                setIsAuthenticating(true);
                const token = tokenInput.trim();
                safeSetStorage(GITHUB_TOKEN_KEY, token);
                
                try {
                    const res = await fetch('https://api.github.com/gists', {
                        headers: { Authorization: `token ${token}` }
                    });
                    
                    if (res.ok) {
                        const gists = await res.json();
                        const existingGist = gists.find(g => g.files && g.files[GIST_FILENAME]);
                        if (existingGist) safeSetStorage(LOCAL_GIST_KEY, existingGist.id);
                        setGithubToken(token);
                    } else {
                        alert(`❌ GitHub rejected this Token. Error: ${res.status}\n\nMake sure the token has "Gists" Read/Write permissions.`);
                        safeRemoveStorage(GITHUB_TOKEN_KEY);
                    }
                } catch (e) { 
                    alert(`Network Error: Could not reach GitHub API.\n\n${e.message}`);
                    safeRemoveStorage(GITHUB_TOKEN_KEY);
                }
                
                setIsAuthenticating(false);
            };

            // --- The Authentication Screen ---
            if (!githubToken) {
                return (
                    <div className="fixed inset-0 bg-gray-950 flex flex-col items-center justify-center p-4">
                        <div className="bg-gray-900 border border-gray-800 p-8 rounded-3xl max-w-md w-full shadow-2xl space-y-6 fade-in">
                            <div className="w-16 h-16 bg-blue-500/10 rounded-2xl flex items-center justify-center mx-auto mb-2 border border-blue-500/20 shadow-inner">
                                {isAuthenticating ? <RefreshCw className="text-blue-500 animate-spin" size={32} /> : <CheckCircle className="text-blue-500" size={32} />}
                            </div>
                            <h2 className="text-2xl font-bold text-white text-center">Secure Cloud Sync</h2>
                            <p className="text-gray-400 text-sm text-center">Enter your GitHub PAT to continue. Make sure the token has <b className="text-white">Gists (Read & Write)</b> permissions enabled.</p>
                            
                            <div className="space-y-2">
                                <input 
                                    type="password" 
                                    value={tokenInput}
                                    onChange={e => setTokenInput(e.target.value)}
                                    disabled={isAuthenticating}
                                    className="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-white text-sm outline-none focus:border-blue-500 text-center font-mono disabled:opacity-50" 
                                    placeholder="ghp_xxxxxxxxxxxxxxxxx" 
                                    onKeyDown={e => { if(e.key === 'Enter') handleSaveToken(); }}
                                />
                            </div>

                            <button onClick={handleSaveToken} disabled={isAuthenticating} className="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl font-bold text-sm shadow-lg transition disabled:opacity-50">
                                {isAuthenticating ? 'Connecting to GitHub...' : 'Authenticate & Sync'}
                            </button>
                        </div>
                    </div>
                );
            }

            if (loading) return null;

            return (
                <div className="fixed inset-0 bg-gray-950 flex flex-col">
                    
                    {/* GLOBAL TOAST NOTIFICATION */}
                    {toast && view !== 'screensaver' && (
                        <div className={`fixed bottom-6 right-6 px-6 py-4 rounded-2xl shadow-2xl border z-50 flex items-center gap-3 slide-up ${toast.type === 'error' ? 'bg-red-950/90 border-red-900 text-red-200' : toast.type === 'success' ? 'bg-emerald-950/90 border-emerald-900 text-emerald-200' : 'bg-gray-800/90 border-gray-700 text-white'}`}>
                            <Box size={20} className={toast.type === 'error' ? 'text-red-500' : toast.type === 'success' ? 'text-emerald-500' : 'text-blue-500'}/>
                            <p className="text-sm font-bold">{toast.msg}</p>
                        </div>
                    )}

                    {view !== 'screensaver' && (
                        <header className="h-16 bg-gray-900/80 backdrop-blur-xl border-b border-gray-800 flex items-center justify-between px-6 z-40">
                            <div className="flex items-center gap-6">
                                <div className="flex items-center gap-3"><Box className="text-blue-500" size={24}/><h1 className="text-lg font-black text-white uppercase tracking-widest">ANIM<span className="text-blue-500">TRACK</span></h1></div>
                                <div className="flex bg-gray-950/50 p-1 rounded-2xl border border-gray-800 shadow-inner hidden md:flex">
                                    <button onClick={()=>setView('board')} className={`p-2 px-4 rounded-xl transition ${view==='board'?'bg-gray-800 text-white shadow-xl':'text-gray-500 hover:text-gray-400'}`}><LayoutGrid size={16}/></button>
                                    <button onClick={()=>setView('calendar')} className={`p-2 px-4 rounded-xl transition ${view==='calendar'?'bg-gray-800 text-white shadow-xl':'text-gray-500 hover:text-gray-400'}`}><CalendarDays size={16}/></button>
                                    <button onClick={()=>setView('stats')} className={`p-2 px-4 rounded-xl transition ${view==='stats'?'bg-gray-800 text-white shadow-xl':'text-gray-500 hover:text-gray-400'}`}><BarChart2 size={16}/></button>
                                    <button onClick={()=>setView('leaves')} className={`p-2 px-4 rounded-xl transition ${view==='leaves'?'bg-gray-800 text-white shadow-xl':'text-gray-500 hover:text-gray-400'}`}><Umbrella size={16}/></button>
                                    <button onClick={()=>setView('screensaver')} className={`p-2 px-4 rounded-xl transition text-gray-500 hover:text-gray-400 ml-2`} title="TV Dashboard Mode"><Monitor size={16}/></button>
                                </div>
                            </div>
                            {view === 'calendar' && (
                                <div className="flex items-center gap-3 bg-gray-950/80 px-2 py-1 rounded-2xl border border-gray-800 shadow-lg hidden lg:flex">
                                    <button onClick={()=>setCurrentDate(prev => { const d = new Date(prev); d.setMonth(d.getMonth()-1); return d; })} className="p-1.5 hover:bg-gray-800 rounded-lg text-gray-500 transition"><ChevronLeft size={18}/></button>
                                    <span className="text-[10px] font-black uppercase text-gray-200 min-w-[120px] text-center tracking-widest">{currentDate.toLocaleString('default', { month: 'long', year: 'numeric' })}</span>
                                    <button onClick={()=>setCurrentDate(prev => { const d = new Date(prev); d.setMonth(d.getMonth()+1); return d; })} className="p-1.5 hover:bg-gray-800 rounded-lg text-gray-500 transition"><ChevronRight size={18}/></button>
                                </div>
                            )}
                            <div className="flex items-center gap-2">
                                <button onClick={()=>setShowRates(!showRates)} className="w-10 h-10 flex items-center justify-center bg-gray-800/50 border border-gray-700 rounded-2xl text-gray-400 hover:text-white transition shadow-sm hidden sm:flex">{showRates?<Eye size={18}/>:<EyeOff size={18}/>}</button>
                                
                                {/* ALARMS BUTTON */}
                                <button onClick={()=>setIsRemindersOpen(true)} className="w-10 h-10 flex items-center justify-center bg-gray-800/50 border border-gray-700 rounded-2xl text-yellow-500 hover:text-yellow-400 hover:bg-gray-800 transition shadow-sm relative" title="Notifications & Timers">
                                    <Bell size={18}/>
                                    {(data.reminders || []).length > 0 && <span className="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border border-gray-900"></span>}
                                </button>
                                
                                {/* MANUAL SYNC CONTROLS */}
                                <div className="flex bg-gray-900 border border-gray-800 rounded-2xl p-1 shadow-inner">
                                    <button onClick={() => forcePullFromCloud(false)} className="w-8 h-8 flex items-center justify-center rounded-xl text-blue-400 hover:bg-gray-800 hover:text-blue-300 transition" title="Pull Latest Data from GitHub">
                                        <Download size={14} />
                                    </button>
                                    <div className="w-px h-5 bg-gray-800 my-auto mx-1"></div>
                                    <button onClick={forcePushToCloud} className="w-8 h-8 flex items-center justify-center rounded-xl text-emerald-400 hover:bg-gray-800 hover:text-emerald-300 transition" title="Force Push to GitHub">
                                        <Upload size={14} />
                                    </button>
                                </div>

                                <button onClick={()=>setIsListOpen(true)} className="w-10 h-10 flex items-center justify-center bg-gray-800/50 border border-gray-700 rounded-2xl text-gray-400 hover:text-white transition shadow-sm"><Settings size={18}/></button>
                                <button onClick={()=>{setEditingProject(null); setIsModalOpen(true);}} className="bg-blue-600 hover:bg-blue-500 text-white h-10 px-5 ml-1 rounded-2xl flex items-center shadow-lg transition font-bold uppercase text-[10px] tracking-widest">New Ticket</button>
                            </div>
                        </header>
                    )}

                    <main className="flex-1 relative overflow-hidden bg-gray-950">
                        {view === 'board' && (
                            <div className="h-full overflow-y-auto p-6 space-y-8 custom-scrollbar">
                                <div className="space-y-4">
                                    <div className="flex items-center gap-3 border-b border-gray-800/50 pb-2 uppercase text-[10px] font-black text-gray-500 tracking-widest">In Progress</div>
                                    <div className="flex gap-4 overflow-x-auto pb-4 no-scrollbar">
                                        {statusGroups.active.map(p => (
                                            <ProjectCard 
                                                key={p.id} 
                                                p={p} 
                                                clients={data.clients} 
                                                showRates={showRates} 
                                                onEdit={(proj)=>{setEditingProject(proj); setIsModalOpen(true);}} 
                                                onSelect={()=>setActiveProject(p)} 
                                                onAdvance={handleAdvanceStage} 
                                                onRevision={handleRevisionNeeded}
                                                onUpdate={(id, up)=>setData(prev => ({...prev, projects: (prev.projects || []).map(x=>x.id===id?{...x, ...up}:x)}))}
                                            />
                                        ))}
                                    </div>
                                </div>
                                <div className="space-y-4">
                                    <div className="flex items-center gap-3 border-b border-gray-800/50 pb-2 uppercase text-[10px] font-black text-gray-500 tracking-widest text-yellow-500">Done / Pending Pay</div>
                                    <div className="flex gap-4 overflow-x-auto pb-4 no-scrollbar">
                                        {Object.entries(groupedDone).map(([client, items]) => (
                                            <div key={client} className="bg-gray-900 border border-gray-800 p-5 rounded-3xl min-w-[300px] shrink-0 space-y-4 hover:border-gray-600 transition shadow-xl relative overflow-hidden text-white">
                                                <div className="flex items-center gap-2 border-b border-gray-800 pb-2"><Briefcase size={12} className="text-yellow-500"/><h4 className="text-[10px] font-black uppercase tracking-widest truncate">{client}</h4></div>
                                                <div className="space-y-2">
                                                    {items.map(item => (
                                                        <div key={item.id} className="flex justify-between items-center group/item hover:bg-gray-800/50 p-2 rounded-xl transition cursor-pointer" onClick={()=>setActiveProject(item)}>
                                                            <div className="min-w-0 pr-2"><p className="text-[11px] font-bold text-gray-300 truncate">{item.name}</p><p className="text-[9px] text-gray-500 font-mono tracking-tighter">{showRates ? `$${calculateTicketValue(item, data.clients).toLocaleString()}` : '****'}</p></div>
                                                            <div className="flex gap-1 opacity-0 group-hover/item:opacity-100 transition shrink-0">
                                                                <button onClick={(e)=>{e.stopPropagation(); handleRevertStage(item);}} className="p-1.5 bg-gray-800 rounded-lg text-orange-400 hover:bg-gray-700 transition"><RotateCcw size={12}/></button>
                                                                <button onClick={(e)=>{e.stopPropagation(); handleAdvanceStage(item);}} className="p-1.5 bg-gray-800 rounded-lg text-emerald-400 hover:bg-gray-700 transition"><ArrowRight size={12}/></button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="space-y-4">
                                    <div className="flex items-center gap-3 border-b border-gray-800/50 pb-2 uppercase text-[10px] font-black text-gray-500 tracking-widest text-emerald-500">Archive</div>
                                    <div className="space-y-6">
                                        {Object.entries(groupedArchive).map(([month, items]) => (
                                            <div key={month} className="space-y-2">
                                                <h4 className="text-[10px] font-black text-emerald-500/60 uppercase tracking-widest ml-1">{month}</h4>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
                                                    {items.map(p => (
                                                        <div key={p.id} onClick={()=>setActiveProject(p)} className="bg-gray-900 border border-gray-800 p-3 rounded-2xl flex justify-between items-center hover:border-gray-600 transition cursor-pointer shadow-md active:scale-95 text-white">
                                                            <div className="min-w-0 pr-2">
                                                                <p className="text-[9px] font-bold text-gray-500 uppercase truncate">{p.client}</p>
                                                                <h4 className="text-xs font-bold truncate leading-tight">{p.name}</h4>
                                                            </div>
                                                            <div className="text-right shrink-0"><span className="text-xs font-mono font-bold text-emerald-400">{showRates ? `$${calculateTicketValue(p, data.clients).toLocaleString()}` : '****'}</span></div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                        {view === 'calendar' && <CalendarBoard projects={data.projects} currentDate={currentDate} onEdit={(p)=>{setEditingProject(p); setIsModalOpen(true);}} holidays={data.holidays} leaves={data.leaves} />}
                        {view === 'stats' && <StatisticsView projects={data.projects} clients={data.clients} leaves={data.leaves} totalLeaves={data.totalLeaves} showRates={showRates} />}
                        {view === 'leaves' && <TimeOffView leaves={data.leaves} holidays={data.holidays} totalLeaves={data.totalLeaves} onAddLeave={handleAddLeave} onDeleteLeave={handleDeleteLeave} onUpdateHolidays={handleUpdateHolidays} onUpdateTotalLeaves={handleUpdateTotalLeaves} />}
                        
                        {/* THE SCREENSAVER */}
                        {view === 'screensaver' && <ScreensaverView projects={data.projects} reminders={data.reminders} onExit={() => setView('board')} onAutoSync={forcePullFromCloud} />}
                    </main>
                    
                    {/* Mobile Nav Tabs (Visible only on small screens) */}
                    {view !== 'screensaver' && (
                        <div className="md:hidden flex bg-gray-900/90 backdrop-blur-xl border-t border-gray-800 p-2 safe-area-bottom justify-around z-40">
                            <button onClick={()=>setView('board')} className={`p-3 rounded-2xl flex flex-col items-center gap-1 flex-1 ${view==='board'?'text-blue-500':'text-gray-500'}`}><LayoutGrid size={20}/></button>
                            <button onClick={()=>setView('calendar')} className={`p-3 rounded-2xl flex flex-col items-center gap-1 flex-1 ${view==='calendar'?'text-blue-500':'text-gray-500'}`}><CalendarDays size={20}/></button>
                            <button onClick={()=>setView('stats')} className={`p-3 rounded-2xl flex flex-col items-center gap-1 flex-1 ${view==='stats'?'text-blue-500':'text-gray-500'}`}><BarChart2 size={20}/></button>
                            <button onClick={()=>setView('leaves')} className={`p-3 rounded-2xl flex flex-col items-center gap-1 flex-1 ${view==='leaves'?'text-blue-500':'text-gray-500'}`}><Umbrella size={20}/></button>
                            <button onClick={()=>setView('screensaver')} className={`p-3 rounded-2xl flex flex-col items-center gap-1 flex-1 text-gray-500`}><Monitor size={20}/></button>
                        </div>
                    )}

                    <ProjectModal isOpen={isModalOpen} onClose={()=>setIsModalOpen(false)} onSave={handleSaveProject} onDelete={(id)=>setData(prev=>({...prev, projects:(prev.projects || []).filter(x=>x.id!==id)}))} initialData={editingProject} clients={data.clients} />
                    <ListManager isOpen={isListOpen} onClose={()=>setIsListOpen(false)} onUpdateLists={handleUpdateLists} initialClients={data.clients} allData={data} onImport={handleImport} />
                    <RemindersManager isOpen={isRemindersOpen} onClose={()=>setIsRemindersOpen(false)} reminders={data.reminders} onUpdateReminders={handleUpdateReminders} />
                    {activeProject && <ProjectDetails project={activeProject} onClose={()=>setActiveProject(null)} onEdit={()=>{ setEditingProject(activeProject); setIsModalOpen(true); setActiveProject(null); }} onAdvance={handleAdvanceStage} onRevert={handleRevertStage} onRevision={handleRevisionNeeded} onUpdate={(id, up)=>setData(prev => ({...prev, projects: (prev.projects || []).map(x=>x.id===id?{...x, ...up}:x)}))} />}
                </div>
            );
        }
        const root = createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
